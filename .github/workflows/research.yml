name: VASTcode21 autonomous research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VC21_CORE_KEY: ${{ secrets.VC21_CORE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decrypt dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Validate secret and seed
        shell: bash
        run: |
          test -n "$VC21_CORE_KEY" || (echo 'Missing VC21_CORE_KEY repository secret' && exit 2)
          test -f payload/core.enc || (echo 'Missing payload/core.enc' && exit 2)
          test -f payload/seed.enc || (echo 'Missing payload/seed.enc; build it once on the MT5 Windows machine' && exit 3)

      - name: Decrypt core
        run: |
          mkdir -p work/core
          python tools/decrypt_payload.py payload/core.enc work/core.tar.gz
          python tools/unpack_tar.py work/core.tar.gz work/core

      - name: Decrypt broker seed
        run: |
          python tools/decrypt_payload.py payload/seed.enc work/seed.tar.gz
          python tools/unpack_tar.py work/seed.tar.gz work/core

      - name: Restore encrypted research state
        shell: bash
        run: |
          if [ -f state/state.enc ]; then
            python tools/decrypt_payload.py state/state.enc work/state.tar.gz
            python tools/unpack_tar.py work/state.tar.gz work/core
          fi

      - name: Install research dependencies
        working-directory: work/core
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt

      - name: Run one autonomous research cycle
        working-directory: work/core
        env:
          VASTCODE21_CLOUD_DB: data/cloud/vastcode21_cloud.db
        run: python scripts/cloud_worker.py --once

      - name: Encrypt persistent state
        run: |
          python tools/pack_state.py work/core work/state.tar.gz
          python tools/encrypt_payload.py work/state.tar.gz state/state.enc
          python tools/public_summary.py work/core/data/cloud/vastcode21_cloud.db status/summary.json

      - name: Commit encrypted state and public counters
        shell: bash
        run: |
          git config user.name 'VASTcode21 Research Bot'
          git config user.email 'vastcode21-bot@users.noreply.github.com'
          git add state/state.enc status/summary.json
          if git diff --cached --quiet; then
            echo 'No state change.'
          else
            git commit -m 'chore: autonomous research state update'
            git push
          fi
