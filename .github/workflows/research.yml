name: VASTcode21 autonomous research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VC21_CORE_KEY: ${{ secrets.VC21_CORE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install decrypt dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Validate secret and seed
        shell: bash
        run: |
          test -n "$VC21_CORE_KEY" || (echo 'Missing VC21_CORE_KEY repository secret' && exit 2)
          test -f payload/core.enc || (echo 'Missing payload/core.enc' && exit 2)
          test -f payload/seed.enc || (echo 'Missing payload/seed.enc; build it once on the MT5 Windows machine' && exit 3)

      - name: Decrypt core
        run: |
          mkdir -p work/core
          python tools/decrypt_payload.py payload/core.enc work/core.tar.gz
          python tools/unpack_tar.py work/core.tar.gz work/core

      - name: Decrypt broker seed
        run: |
          python tools/decrypt_payload.py payload/seed.enc work/seed.tar.gz
          python tools/unpack_tar.py work/seed.tar.gz work/core

      - name: Restore encrypted research state
        shell: bash
        run: |
          if [ -f state/state.enc ]; then
            python tools/decrypt_payload.py state/state.enc work/state.tar.gz
            python tools/unpack_tar.py work/state.tar.gz work/core
          fi

      - name: Decrypt MT5 validation inbox
        shell: bash
        run: |
          mkdir -p work/core/cloud_inbox
          shopt -s nullglob
          for f in handoff/inbox/*.enc; do
            name="$(basename "$f" .enc)"
            python tools/decrypt_payload.py "$f" "work/core/cloud_inbox/${name}.json"
          done

      - name: Collect and analyze external context
        shell: bash
        run: |
          python tools/context_intelligence_ingest.py \
            work/core \
            config/context_sources.json \
            status/context_intelligence.json || echo 'WARNING: context intelligence is degraded this cycle; core research continues.'

      - name: Audit research freedom and context intelligence
        run: |
          python tools/research_freedom_audit.py \
            work/core \
            config/research_freedom_contract.json \
            config/context_intelligence_contract.json \
            status/research_freedom.json

      - name: Install research dependencies
        working-directory: work/core
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt

      - name: Run one autonomous research cycle
        working-directory: work/core
        env:
          VASTCODE21_CLOUD_DB: data/cloud/vastcode21_cloud.db
          PYTHONPATH: ${{ github.workspace }}/work/core
          VC21_RESEARCH_FREEDOM: '1'
          VC21_TRADE_SCOPE: 'XAUUSD,BTCUSD'
          VC21_INFORMATION_SCOPE: 'unbounded_relevant'
          VC21_RESEARCH_FREEDOM_CONTRACT: ${{ github.workspace }}/config/research_freedom_contract.json
          VC21_CONTEXT_INTELLIGENCE_CONTRACT: ${{ github.workspace }}/config/context_intelligence_contract.json
          VC21_CONTEXT_DB: ${{ github.workspace }}/work/core/data/context/context.db
          VC21_CONTEXT_LATEST: ${{ github.workspace }}/work/core/data/context/latest.json
          VC21_CONTEXT_FEATURES: ${{ github.workspace }}/work/core/data/context/features.json
          VC21_CONTEXT_MANIFEST: ${{ github.workspace }}/work/core/data/context/manifest.json
        run: python scripts/cloud_worker.py --once

      - name: Encrypt persistent state
        run: |
          python tools/pack_state.py work/core work/state.tar.gz
          python tools/encrypt_payload.py work/state.tar.gz state/state.enc
          python tools/public_summary.py work/core/data/cloud/vastcode21_cloud.db status/summary.json

      - name: Commit encrypted state, counters, context health, freedom audit, and consume MT5 inbox
        shell: bash
        run: |
          git config user.name 'VASTcode21 Research Bot'
          git config user.email 'vastcode21-bot@users.noreply.github.com'
          git add state/state.enc status/summary.json status/research_freedom.json status/context_intelligence.json
          shopt -s nullglob
          inbox=(handoff/inbox/*.enc)
          if [ ${#inbox[@]} -gt 0 ]; then
            git rm -f -- "${inbox[@]}"
          fi
          if git diff --cached --quiet; then
            echo 'No state change.'
          else
            git commit -m 'chore: autonomous research state update'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish autonomous state after retries' >&2
                exit 1
              fi
              sleep 3
            done
          fi
