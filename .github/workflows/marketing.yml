name: VASTcode21 organic growth engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'status/summary.json'
      - 'status/autonomy.json'
      - 'site/data/event_risk.json'
      - 'marketing/brand.json'
      - 'marketing/social_config.json'
      - 'tools/marketing_planner.py'
      - 'tools/instagram_link_in_bio_cleanup.py'
      - 'tools/marketing_asset_builder.py'
      - 'tools/instagram_growth_analytics.py'
      - '.github/workflows/marketing.yml'
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-marketing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install free asset dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Collect Instagram growth metrics
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python tools/instagram_growth_analytics.py

      - name: Generate discovery-focused organic content queue
        run: python tools/marketing_planner.py

      - name: Route service CTAs to clickable profile links
        run: python tools/instagram_link_in_bio_cleanup.py

      - name: Generate branded image carousel and Reel assets
        run: python tools/marketing_asset_builder.py

      - name: Commit growth metrics queue and assets when changed
        shell: bash
        run: |
          git config user.name 'VASTcode21 Growth Bot'
          git config user.email 'vastcode21-bot@users.noreply.github.com'
          git add marketing/queue.json marketing/assets/ marketing/growth_metrics.json marketing/growth_history.json
          if git diff --cached --quiet; then
            echo 'No organic growth state or asset change.'
          else
            git commit -m 'chore: refresh organic growth content and metrics'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish growth assets after retries' >&2
                exit 1
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
          fi
