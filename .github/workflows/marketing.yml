name: VASTcode21 marketing planner

on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-marketing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install free asset dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate safe organic content queue
        run: python tools/marketing_planner.py

      - name: Generate branded Instagram assets
        run: python tools/marketing_asset_builder.py

      - name: Commit queue and assets when changed
        shell: bash
        run: |
          git config user.name 'VASTcode21 Marketing Bot'
          git config user.email 'vastcode21-bot@users.noreply.github.com'
          git add marketing/queue.json marketing/assets/
          if git diff --cached --quiet; then
            echo 'No marketing queue or asset change.'
          else
            git commit -m 'chore: refresh marketing content and assets'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not publish marketing assets after retries' >&2
                exit 1
              fi
              sleep 3
            done
          fi
