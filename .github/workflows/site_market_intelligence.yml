name: VASTcode21 public market intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/site_market_feed.py'
      - 'tools/site_event_risk.py'
      - 'config/context_sources.json'
      - 'config/bls_schedule_fallback_2026.json'
      - '.github/workflows/site_market_intelligence.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-site-market-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh public market intelligence snapshot
        run: python tools/site_market_feed.py
      - name: Refresh official-source event risk snapshot
        run: python tools/site_event_risk.py
      - name: Commit public intelligence feeds when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VASTcode21 Market Monitor'
          git config user.email 'vastcode21-bot@users.noreply.github.com'

          for attempt in 1 2 3; do
            # Always regenerate time-sensitive JSON from the newest main. This avoids
            # rebasing generated feed files, which can conflict with concurrent commits.
            git fetch origin main
            git reset --hard origin/main
            python tools/site_market_feed.py
            python tools/site_event_risk.py
            git add site/data/market_intelligence.json site/data/event_risk.json

            if git diff --cached --quiet; then
              echo 'No public intelligence change.'
              exit 0
            fi

            git commit -m 'chore: refresh public market intelligence and event risk'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; regenerating on latest main (attempt ${attempt}/3)."
            sleep 3
          done

          echo 'Could not persist public intelligence feeds after 3 race-safe attempts' >&2
          exit 1
