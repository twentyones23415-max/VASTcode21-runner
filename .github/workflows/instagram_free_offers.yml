name: VASTcode21 service-offer publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/instagram_free_offer_publisher.py'
      - '.github/workflows/instagram_free_offers.yml'
      - 'marketing/queue.json'
      - 'marketing/assets/offers-ready-*.jpg'
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: vastcode21-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Publish approved service offers within global organic cadence
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python tools/instagram_free_offer_publisher.py

      - name: Commit Instagram publish state when changed
        shell: bash
        run: |
          git config user.name 'VASTcode21 Instagram Bot'
          git config user.email 'vastcode21-bot@users.noreply.github.com'
          git add marketing/publish_state.json
          if git diff --cached --quiet; then
            echo 'No service-offer publish state change.'
          else
            git commit -m 'chore: record service-offer publication'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" -eq 3 ]; then
                echo 'Could not persist service-offer publish state' >&2
                exit 1
              fi
              sleep 3
            done
          fi
